version: '3.8'

# ============================================================================
# APAARSetu National Registry System — Production Docker Compose Manifest
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 1. Self-hosted MongoDB 7 (Skip or comment out if using MongoDB Atlas)
  # --------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0-jammy
    container_name: apaarsetu-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: apaarsetu
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - apaarsetu-internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: '2.0'
        reservations:
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # 2. Spring Boot 3.2 Backend Microservice
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./apaarsetu-backend
      dockerfile: Dockerfile
    container_name: apaarsetu-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8081
      TRUST_PROXY: "true"
      MONGODB_URI: ${MONGODB_URI:-mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/apaarsetu?authSource=admin}
      JWT_SECRET: ${JWT_SECRET}
      AES_KEY: ${AES_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-https://apaarsetu.example.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://apaarsetu.example.com}
      APP_BOOTSTRAP_ENABLED: "false"
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-1000}
      VERIFICATION_PER_MINUTE: ${VERIFICATION_PER_MINUTE:-200}
      SWAGGER_ENABLED: "false"
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
    networks:
      - apaarsetu-internal
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '2.0'
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # 3. Next.js 16 Standalone Frontend
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./apaarsetufrontend
      dockerfile: Dockerfile
    container_name: apaarsetu-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      INTERNAL_BACKEND_URL: http://backend:8081/api/v1
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - apaarsetu-internal
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.5'
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # 4. Hardened Nginx Reverse Proxy & SSL Termination
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: apaarsetu-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - apaarsetu-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # 5. Certbot (Automated Let's Encrypt SSL Certificate Renewal)
  # --------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: apaarsetu-certbot
    volumes:
      - certbot_www:/var/www/certbot:rw
      - ./ssl:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - apaarsetu-internal

networks:
  apaarsetu-internal:
    driver: bridge

volumes:
  mongo_data:
  mongo_config:
  certbot_www:

