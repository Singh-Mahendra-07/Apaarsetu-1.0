name: APAARSetu Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # 1. Quality Assurance, Security & Automated Unit Testing
  # ==========================================================================
  test-and-verify:
    name: Backend & Frontend Automated Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit & Security Tests
        working-directory: ./apaarsetu-backend
        run: |
          mvn clean test -Dtest=CryptoFailClosedSecurityTest,AuthServiceSecurityTest,BatchCapacityApprovalSecurityTest,VerificationServiceSecurityTest,ValidationEngineQuotaSecurityTest

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./apaarsetufrontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./apaarsetufrontend
        run: npm ci

      - name: Lint Frontend Codebase
        working-directory: ./apaarsetufrontend
        run: npm run lint

      - name: Compile & Build Next.js Production Bundles
        working-directory: ./apaarsetufrontend
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          INTERNAL_BACKEND_URL: http://backend:8081/api/v1
          JWT_SECRET: ProductionCiCdTokenVerificationSecretKeyMinimum256BitsLong123
        run: npm run build

  # ==========================================================================
  # 2. Container Build and Image Registry Packaging
  # ==========================================================================
  build-and-push:
    name: Build & Push Production Docker Images
    needs: test-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./apaarsetu-backend
          file: ./apaarsetu-backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/apaarsetu-backend:latest
            ghcr.io/${{ github.repository_owner }}/apaarsetu-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./apaarsetufrontend
          file: ./apaarsetufrontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/apaarsetu-frontend:latest
            ghcr.io/${{ github.repository_owner }}/apaarsetu-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # 3. Production Deployment & Live Post-Deploy Verification
  # ==========================================================================
  deploy-production:
    name: Deploy to Production Host & Health Check
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to Target Production Host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/apaarsetu

            echo "[1/4] Pulling latest production container images..."
            docker compose -f docker-compose.prod.yml pull backend frontend

            echo "[2/4] Executing zero-downtime rolling service restart..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "[3/4] Awaiting container health check stabilization..."
            sleep 15

            echo "[4/4] Verifying production health endpoints..."
            for i in {1..12}; do
              HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/api/v1/health || true)
              if [ "$HEALTH_STATUS" = "200" ]; then
                echo "SUCCESS: Production backend health probe confirmed HTTP 200 OK."
                exit 0
              fi
              echo "Waiting for health probe (attempt $i/12, status: $HEALTH_STATUS)..."
              sleep 5
            done
            echo "ERROR: Health check failed! Initiating automated rollback..."
            exit 1

